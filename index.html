<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Name | Portfolio</title>
    <meta
      name="description"
      content="Starter portfolio landing page hosted on GitHub Pages."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="nav">
        <a class="logo" href="#">YourName</a>
        <a class="button button-secondary" href="#contact">Contact</a>
      </nav>

      <main class="hero-content">
        <p class="eyebrow">Portfolio Landing Page</p>
        <h1>Hi, I'm Your Name.</h1>
        <p class="subtitle">
          I build modern web experiences. This is a starter homepage for your
          GitHub Pages portfolio.
        </p>
        <div class="actions">
          <a class="button" href="#projects">View Projects</a>
          <a class="button button-secondary" href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </main>
    </header>

    <section id="projects" class="section">
      <h2>Featured Projects</h2>
      <p>Add 2-3 project cards here once you are ready.</p>
    </section>

    <section id="contact" class="section">
      <h2>Get in touch</h2>
      <p>
        Reach out at
        <a href="mailto:you@example.com">you@example.com</a>
      </p>
    </section>
  </body>
</html>
